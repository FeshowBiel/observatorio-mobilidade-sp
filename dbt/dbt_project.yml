name: 'observatorio'
version: '1.0.0'
config-version: 2

profile: 'observatorio'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  observatorio:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      core:
        +tags: ["core"]
      analytics:
        +tags: ["analytics"]
